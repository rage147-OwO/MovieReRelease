name: crawl

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
    - cron: "*/20 * * * *" # 임시: cron 트리거 동작 테스트용 — 확인 후 제거할 것
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl movies
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        run: python -m crawler.main

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/movies.json
          git diff --cached --quiet || git commit -m "data: update movies ($(date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main

      # 아래 3단계는 저장소가 public(또는 유료 플랜)이어야 성공한다.
      # 그 전까지는 실패해도 크롤 자체는 성공으로 유지 (continue-on-error)
      - name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
