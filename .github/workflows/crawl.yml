name: crawl

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl movies
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        run: python -m crawler.main

      - name: Commit updated data
        # movies.json은 매번 전량 재생성되는 산출물이라 병합 대상이 아니다.
        # (workflow re-run은 최신 main이 아닌 원래 트리거 커밋을 체크아웃하므로
        #  rebase/merge 시도는 실제 내용 충돌을 일으킬 수 있다 — 항상 최신 main 위에 덮어쓴다.)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/data/movies.json /tmp/movies.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/movies.json docs/data/movies.json
          git add docs/data/movies.json
          git diff --cached --quiet || git commit -m "data: update movies ($(date +%F))"
          git push origin HEAD:main

      # 아래 3단계는 저장소가 public(또는 유료 플랜)이어야 성공한다.
      # 그 전까지는 실패해도 크롤 자체는 성공으로 유지 (continue-on-error)
      - name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
