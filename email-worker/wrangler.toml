name = "movie-rerelease-email"
main = "worker.mjs"
compatibility_date = "2026-06-01"
preview_urls = false

[vars]
SITE_URL = "https://rage147-owo.github.io/MovieReRelease/"

[triggers]
crons = ["0 0 * * MON"] # 월요일 오전 9시 KST

[[d1_databases]]
binding = "DB"
database_name = "movie-rerelease-email"
database_id = "00000000-0000-0000-0000-000000000000"

[[ratelimits]]
name = "EMAIL_REQUEST_LIMIT"
namespace_id = "14701"
simple = { limit = 5, period = 60 }
